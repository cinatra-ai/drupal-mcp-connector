name: docs-meta-commentary

# Runs the reusable meta-commentary gate (cinatra-ai/ci) against this repo's
# published Markdown surfaces — the top-level README.md and CHANGELOG.md:
# fails a PR when a published, user-facing page carries meta/implementation
# commentary about how the docs THEMSELVES are produced — generation mechanics,
# "forthcoming"/placeholder transition notes, editorial TODOs, and the like.
# Wires cinatra-ai/docs#156 (the published-surface caller rollout) into this
# repo; this repo has no docs/ tree, so the scan set is README.md + CHANGELOG.md
# only (each entry must exist and yield a tracked Markdown file — the gate
# fails closed on a missing surface).
#
# Structured like the sibling source-leak-gate.yml caller: both the workflow
# ref (`@<sha>`) and the `ref` input are pinned to the SAME cinatra-ai/ci commit
# SHA, so the gate engine is not pulled from mutable main.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  meta-commentary-gate:
    uses: cinatra-ai/ci/.github/workflows/meta-commentary-gate.yml@533a12a64a596e6ce5df3887e0ebbad5a7d6b953 # v0.1.3-next.533a12a
    with:
      paths: |
        README.md
        CHANGELOG.md
      ref: 533a12a64a596e6ce5df3887e0ebbad5a7d6b953
